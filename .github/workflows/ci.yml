# Quality gate for PRs and pushes to main: lint, typecheck, tests (which
# include a full site build against the committed fixture, web/test-data).
# No secrets here and no pipeline run: since the amended ADR-0005 a missing
# GEMINI_API_KEY fails the build, so CI exercises `pnpm edition` in no
# workflow. The fixture build (PRISME_DATA_DIR, web/src/data.ts) keeps the
# gate deterministic — the archive shifts under every hourly run; the
# real-data build is exercised where it matters, by the deploy workflows on
# main (edition.yml hourly, web.yml on merges), from the same data/ the
# site serves.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # pnpm test includes the web build-output suite: two astro builds —
      # the committed fixture and an empty-« En direct » derived copy — so
      # the shipped pages (incl. /en-direct/) are asserted on what the
      # build actually renders, independent of the changing archive.
      - run: pnpm test