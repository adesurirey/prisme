# Quality gate for PRs and pushes to main: lint, typecheck, tests, and a full
# site build. No secrets here and no pipeline run: since the amended ADR-0005
# a missing GEMINI_API_KEY fails the build, so CI exercises `pnpm edition` in
# no workflow. The web build runs against the committed data/ (ADR-0002), the
# same live dataset the site serves.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # The web build needs data/ to exist; it uses the committed edition
      # (ADR-0002). The pipeline itself is only exercised by the scheduled
      # edition.yml workflow, which holds the model keys.
      - run: pnpm --filter @prisme/web build