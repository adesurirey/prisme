name: Edition

# Hourly, all 24 hours — feeds roll continuously and every build gives fresh
# Articles another chance to be grouped while still inside the 24h live window
# (ADR-0009), with only ~1 h of tail lost on a failed build (ADR-0005).
#
# The minute is offset to :23 on purpose, not top of the hour: GitHub Actions
# runs cron slots on 00/15/30/45 past the hour and almost every repo fires
# there, so the shared scheduler queue is crush-congested at those minutes and
# scheduled runs can slip tens of minutes. :23 hits a quiet minute and starts
# within a few minutes of the scheduled time. Paris is UTC+1 in winter (CET)
# and UTC+2 in summer (CEST), so :23 lands at a different real time each hour
# in either season.
#
# Every build commits, even when no Story changed — edition.json's builtAt is
# set unconditionally each run, so the commit is never empty and the home
# page's « dernier point à hh h » always reflects the real verification time
# (ADR-0002). Also triggerable by hand.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The pipeline tolerates failing feeds; a total failure aborts the build.
      # OPENROUTER_API_KEY drives Article classification (issue #4) and the
      # Membership check (issue #5); without it classification degrades to
      # unclassified Articles, retried next build. GEMINI_API_KEY drives Story
      # grouping (issue #5); per the amended ADR-0005 a missing key — like a
      # failed Grouping call — fails the build, since degraded grouping
      # corrupts the archive permanently.
      - run: pnpm edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit data
        run: |
          git config user.name "prisme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update edition ($(date -u +%FT%TZ))"
            git push
          fi

      # Build the site from the same data that was just committed, so the
      # deployed HTML and the committed JSON never disagree.
      - run: pnpm --filter @prisme/web build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
