name: Edition

# Hourly, all 24 hours — feeds roll continuously and every build gives fresh
# Articles another chance to be grouped while still inside the 24h live window
# (ADR-0009), with only ~1 h of tail lost on a failed build (ADR-0005).
#
# The minute is offset to :23 on purpose, not top of the hour: GitHub Actions
# runs cron slots on 00/15/30/45 past the hour and almost every repo fires
# there, so the shared scheduler queue is crush-congested at those minutes and
# scheduled runs can slip tens of minutes. :23 hits a quiet minute and starts
# within a few minutes of the scheduled time. Paris is UTC+1 in winter (CET)
# and UTC+2 in summer (CEST), so :23 lands at a different real time each hour
# in either season.
#
# Every build commits, even when no Story changed — edition.json's builtAt is
# set unconditionally each run, so the commit is never empty and the home
# page's « dernier point à hh h » always reflects the real verification time
# (ADR-0002). Also triggerable by hand.
#
# MIGRATED TO cron-job.org (2025): GitHub's scheduler was dropping most hourly
# slots (only ~2 fired per day), so the hourly trigger now comes from an
# external cron-job.org job POSTing to the workflow_dispatch API every hour at
# :23. The schedule block is kept, commented out, as a documented fallback —
# uncomment it if the external trigger is ever lost.
on:
  # schedule:
  #   - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Private teaser cache round-trip (ADR-0027, amending ADR-0003): the
      # pipeline accumulates Outlet-written teaser text into .cache/teasers.json
      # so multi-day Story re-Summaries keep their input quality after Articles
      # rotate out of the feeds. The file is never committed (gitignored); the
      # Actions cache carries it across hourly builds. The key is unique per
      # run and restore-keys falls back to the newest previous cache.
      # The Membership-refusal cache (issue #148) rides the same pattern:
      # .cache/refusals.json carries the 48 h ledger of definitive Membership
      # refusals so an identical (Article, Story) question is never paid for
      # twice — ids and instants only.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/teasers.json
          key: teasers-${{ github.run_id }}
          restore-keys: |
            teasers-

      - uses: actions/cache/restore@v4
        with:
          path: .cache/refusals.json
          key: refusals-${{ github.run_id }}
          restore-keys: |
            refusals-

      # The pipeline tolerates failing feeds; a total failure aborts the build.
      # OPENROUTER_API_KEY drives Article classification (issue #4) and the
      # Membership check (issue #5); without it classification degrades to
      # unclassified Articles, retried next build. GEMINI_API_KEY drives Story
      # grouping (issue #5); per the amended ADR-0005 a missing key — like a
      # failed Grouping call — fails the build, since degraded grouping
      # corrupts the archive permanently.
      - run: pnpm edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/teasers.json
          key: teasers-${{ github.run_id }}

      # Written only when every model pass succeeded; saving a restored or
      # absent file on a failed build is harmless (never wrong data).
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/refusals.json
          key: refusals-${{ github.run_id }}

      # Classification checkpoint on failure (2026-11-05 outage): Classify
      # runs before Group and pays OpenRouter per fresh Article, but the
      # cache only reached the repo when the whole run succeeded — a failed
      # hourly run lost its classifications with the workspace, so every
      # retry re-classified (and re-paid) the same growing backlog of
      # Articles. Checkpointing data/classifications.json on failure makes
      # each hour's spend durable. It is a pure id → kind/section map,
      # ADR-0003-safe, written before Grouping — valid whatever killed the
      # rest of the run — and already pruned to the current feed window. A
      # failure during Classify itself leaves it unchanged (saveCache runs
      # after classifyNewArticles), so the diff guard commits nothing.
      - name: Checkpoint classifications on failure
        if: failure()
        run: |
          git config user.name "prisme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/classifications.json
          if git diff --cached --quiet; then
            echo "No classification changes to checkpoint"
          else
            git commit -m "data: checkpoint classifications ($(date -u +%FT%TZ))"
            git push
          fi

      - name: Commit data
        run: |
          git config user.name "prisme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update edition ($(date -u +%FT%TZ))"
            git push
          fi

      # Build the site from the same data that was just committed, so the
      # deployed HTML and the committed JSON never disagree.
      - run: pnpm --filter @prisme/web build

      # The app's API is the static site (ADR-0043, issue #176): publish
      # the pipeline JSON the mobile app fetches alongside the HTML it
      # belongs with — same build, same commit. The script's allowlist
      # keeps classifications.json, topics.json, redirects.json and
      # stories/ out of the artifact; the fixture build-output tests run
      # this same script and assert exactly that.
      - name: Publish app data artifact
        run: node web/scripts/publish-app-artifact.mjs web/dist

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
