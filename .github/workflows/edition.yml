name: Edition

# Four builds a day, every 5 hours. GitHub cron is UTC: Paris is UTC+1 in
# winter (CET) and UTC+2 in summer (CEST), so UTC hours 5,10,15,20 cover
# 06:00–21:00 Paris in winter and 07:00–22:00 in summer — never before
# 06:00 Paris time in either season. Also triggerable by hand.
on:
  schedule:
    - cron: '0 5,10,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The pipeline tolerates failing feeds; a total failure aborts the build.
      # OPENROUTER_API_KEY drives Article classification (issue #4) and the
      # Membership check (issue #5); without it Articles stay unclassified and
      # low-confidence merges split. GEMINI_API_KEY drives Story grouping
      # (issue #5); without it each new Article becomes its own Story. Both
      # degradations are by design (ADR-0005): the build never fails on a
      # missing model key.
      - run: pnpm edition
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit data
        run: |
          git config user.name "prisme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update edition ($(date -u +%FT%TZ))"
            git push
          fi

      # Build the site from the same data that was just committed, so the
      # deployed HTML and the committed JSON never disagree.
      - run: pnpm --filter @prisme/web build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
